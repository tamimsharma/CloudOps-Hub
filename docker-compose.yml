services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cloudops-postgres
    environment:
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops
      POSTGRES_DB: cloudops_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudops-network

  # Redis for caching/sessions (optional)
  redis:
    image: redis:7-alpine
    container_name: cloudops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudops-network

  # ---------------------------------------------------------------------------
  # Application: API + web UI served by a single container (one URL).
  #   Start:  docker compose --profile app up --build
  #   Stop:   docker compose --profile app down
  # Environment overrides: APP_PORT (host port), APP_URL (origin for CORS),
  # JWT_SECRET / JWT_REFRESH_SECRET (read from .env when present).
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudops-app
    profiles: ["app"]
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://cloudops:cloudops@postgres:5432/cloudops_hub?schema=public
      JWT_SECRET: ${JWT_SECRET:-cloudops-hub-local-jwt-secret-min-32-chars-000}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cloudops-hub-local-refresh-secret-min-32}
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: ${APP_URL:-http://localhost:4000}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudops-network

  # ---------------------------------------------------------------------------
  # Observability stack - optional, start with: docker compose --profile full up -d
  # ---------------------------------------------------------------------------

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cloudops-prometheus
    profiles: ["full"]
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudops-network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.2.2
    container_name: cloudops-grafana
    profiles: ["full"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudops-network

  # OpenSearch for centralized logging
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: cloudops-opensearch
    profiles: ["full"]
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=admin
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u admin:admin http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - cloudops-network

  # OpenSearch Dashboards (optional)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: cloudops-opensearch-dashboards
    profiles: ["full"]
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: admin
    depends_on:
      - opensearch
    networks:
      - cloudops-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  opensearch_data:

networks:
  cloudops-network:
    driver: bridge
