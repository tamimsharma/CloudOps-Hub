apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cloudops
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudops-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudops-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cloudops
    spec:
      containers:
        - name: web
          image: ghcr.io/<org>/cloudops-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
      restartPolicy: Always
