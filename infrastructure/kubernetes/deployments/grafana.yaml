# Grafana datasource provisioning (inline ConfigMap) + Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: cloudops
    app.kubernetes.io/managed-by: kubectl
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        uid: prometheus
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: cloudops
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudops-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudops-grafana
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: cloudops
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: GF_SERVER_ROOT_URL
              value: http://cloudops.local/grafana/
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-data
          emptyDir: {}
      restartPolicy: Always
