apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cloudops
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
