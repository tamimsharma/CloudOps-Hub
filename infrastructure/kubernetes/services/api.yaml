apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cloudops
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-api
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
