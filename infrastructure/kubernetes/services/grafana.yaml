apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: cloudops
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
