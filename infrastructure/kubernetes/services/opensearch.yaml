apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-opensearch
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: cloudops
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: transport
      protocol: TCP
