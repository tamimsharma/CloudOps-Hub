apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudops
  labels:
    app.kubernetes.io/name: cloudops-prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: cloudops
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudops-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
