name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  COMPOSE_DIR: /opt/cloudops

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      app_image: ${{ steps.image.outputs.app_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: |
          PREFIX="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "app_image=${PREFIX}-app" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image (API + web UI)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.app_image }}:${{ github.sha }}
            ${{ steps.image.outputs.app_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform plan and apply (production)
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

  deploy-ec2:
    name: Deploy to EC2 over SSH
    runs-on: ubuntu-latest
    needs: [build-and-push]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          SSH_HOST: ${{ secrets.AWS_EC2_HOST }}
          SSH_USER: ${{ secrets.AWS_SSH_USER || 'ec2-user' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%b' "$SSH_KEY" > ~/.ssh/cloudops_key
          chmod 600 ~/.ssh/cloudops_key
          ssh-keyscan -H -T 10 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host cloudops-ec2
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/cloudops_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Write deployment environment
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.app_image }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'cloudops' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'change-me-min-32-chars-in-production-please' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'change-me-refresh-min-32-chars-in-prod' }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN || 'http://localhost' }}
        run: |
          cat > deploy.env <<EOF
          APP_IMAGE=${APP_IMAGE}:${{ github.sha }}
          POSTGRES_USER=cloudops
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=cloudops_hub
          DATABASE_URL=postgresql://cloudops:${POSTGRES_PASSWORD}@postgres:5432/cloudops_hub?schema=public
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_REFRESH_EXPIRES_IN=7d
          BCRYPT_ROUNDS=12
          CORS_ORIGIN=${CORS_ORIGIN}
          PROMETHEUS_URL=http://prometheus:9090
          OPENSEARCH_URL=http://opensearch:9200
          RATE_LIMIT_WINDOW_MS=900000
          RATE_LIMIT_MAX_REQUESTS=100
          NODE_ENV=production
          EOF

      - name: Write docker-compose deploy stack
        run: |
          cat > docker-compose.deploy.yml <<'EOF'
          services:
            postgres:
              image: postgres:16-alpine
              restart: unless-stopped
              environment:
                POSTGRES_USER: ${POSTGRES_USER}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                POSTGRES_DB: ${POSTGRES_DB}
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
                interval: 10s
                timeout: 5s
                retries: 5

            redis:
              image: redis:7-alpine
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 10s
                timeout: 5s
                retries: 5

            app:
              image: ${APP_IMAGE}
              restart: unless-stopped
              ports:
                - "80:4000"
                - "4000:4000"
              environment:
                NODE_ENV: ${NODE_ENV}
                PORT: "4000"
                SERVE_WEB: "true"
                DATABASE_URL: ${DATABASE_URL}
                JWT_SECRET: ${JWT_SECRET}
                JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
                JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
                JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
                BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
                CORS_ORIGIN: ${CORS_ORIGIN}
                PROMETHEUS_URL: ${PROMETHEUS_URL}
                OPENSEARCH_URL: ${OPENSEARCH_URL}
                RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
                RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS}
              depends_on:
                postgres:
                  condition: service_healthy

          volumes:
            postgres_data:
          EOF

      - name: Copy deployment files to server
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            deploy.env docker-compose.deploy.yml \
            cloudops-ec2:${COMPOSE_DIR}/

      - name: Log the server in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            ssh cloudops-ec2 "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy with docker compose
        run: |
          ssh cloudops-ec2 "
            set -e
            cd ${COMPOSE_DIR}
            docker compose -p cloudops -f docker-compose.deploy.yml --env-file deploy.env pull
            docker compose -p cloudops -f docker-compose.deploy.yml --env-file deploy.env up -d --remove-orphans
            docker image prune -f
          "

      - name: Smoke test deployed stack
        run: |
          SSH_HOST="${{ secrets.AWS_EC2_HOST }}"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused \
            "http://${SSH_HOST}/" > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused \
            "http://${SSH_HOST}:4000/health" > /dev/null
          echo "Smoke test passed"
